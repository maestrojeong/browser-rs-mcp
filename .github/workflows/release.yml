name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            asset: browser-rs-macos-arm64
            bin: browser-rs
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: browser-rs-linux-x64
            bin: browser-rs
          # Windows needs no source changes: `nix` is already a cfg(unix)
          # dependency and every unix-only path has a cfg(not(unix)) arm.
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: browser-rs-windows-x64.exe
            bin: browser-rs.exe
    runs-on: ${{ matrix.os }}
    # `shasum` and the POSIX test syntax below only exist in bash, which the
    # Windows runner does not use by default.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: Verify release tag matches package version
        run: |
          version="$(cargo pkgid -p ab-mcp | sed -E 's/.*[#@]//')"
          test "v${version}" = "${GITHUB_REF_NAME}" || {
            echo "release tag ${GITHUB_REF_NAME} does not match ab-mcp version v${version}" >&2
            exit 1
          }

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} -p ab-mcp

      - name: Package
        run: |
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "${{ matrix.asset }}"
          shasum -a 256 "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.asset }}
            ${{ matrix.asset }}.sha256
