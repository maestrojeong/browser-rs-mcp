name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  # Windows ships a release asset but has no Chrome-backed bench here, so guard
  # the part that actually regresses: the cfg(not(unix)) arms compiling at all.
  # Without this, a new `nix::`/`UnixStream` call reaches a tag before anyone
  # notices the Windows build is gone.
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --target x86_64-pc-windows-msvc -p ab-mcp

  build-and-bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Build
        run: cargo build --release --workspace

      - name: Test
        run: cargo test --workspace

      # Guard native browser object shape and page-level shim residue. Genuine
      # headless CI traits such as SwiftShader are not failures by themselves.
      - name: Native-surface benchmark
        env:
          AB_CHROME: ${{ steps.chrome.outputs.chrome-path }}
          # Chromium runs as root in the CI container; the sandbox needs relaxing.
          AB_CHROME_FLAGS: "--no-sandbox --disable-dev-shm-usage"
        run: node bench/run.mjs target/release/browser-rs
